[package]
name = "sb-edge"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["sbchild <sbchild0@gmail.com>"]

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
ndk-context = { version = "0.1.1", optional = true }
jni = { version = "0.22.4", features = ["invocation"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
anyhow = "1.0.104"
snafu = "0.9.2"
serde_with = { version = "3.24.0", features = ["base64"] }
sha2 = "0.11.1"
clap = { version = "4.6.9", features = ["derive"] }

[features]
android = ["dep:ndk-context", "dep:jni"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
